<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090a0d" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('tsg_theme');
          var isLight = saved === 'light';
          document.documentElement.classList.toggle('dark', !isLight);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isLight ? '#f6f4ef' : '#090a0d');
        } catch (e) {}
      })();
    </script>
    <title>The Shuttle Games · The Reaping</title>
    <meta name="description" content="The Shuttle Games Badminton Club: The Reaping open play queue, Arena matchmaking, Sponsor's Gifts, and Victors leaderboards." />
    <meta property="og:title" content="The Shuttle Games · The Reaping" />
    <meta property="og:description" content="The Shuttle Games Badminton Club: The Reaping open play queue, Arena matchmaking, Sponsor's Gifts, and Victors leaderboards." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/the_shuttle_games_logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#f6f4ef] dark:bg-[#0b0c10] text-stone-900 dark:text-[#e6e6e6] antialiased selection:bg-amber-500/30 selection:text-amber-900 dark:selection:text-amber-200 min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
